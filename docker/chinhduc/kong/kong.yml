_format_version: "3.0"
_transform: true

services:
  - name: identity-service
    url: http://identity-service:8080
    routes:
      - name: identity-route
        paths:
          - /api/v1/auth
          - /.well-known/openid-configuration
        strip_path: false

  - name: event-service
    url: http://event-service:8080
    routes:
      - name: event-route
        paths:
          - /api/v1/events
        strip_path: false

  - name: booking-service
    url: http://booking-service:8080
    routes:
      - name: booking-route
        paths:
          - /api/v1/bookings
        strip_path: false

  - name: payment-service
    url: http://payment-service:8080
    routes:
      - name: payment-route
        paths:
          - /api/v1/payments
        strip_path: false

  - name: notification-service
    url: http://notification-service:8080
    routes:
      - name: notification-route
        paths:
          - /api/v1/notifications
        strip_path: false

  - name: gps-location-service
    url: http://gps-location-service:3002
    routes:
      - name: gps-route
        paths:
          - /api/v1/gps
        strip_path: false

plugins:
  - name: cors
    config:
      origins:
        - "*"
      methods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
      headers:
        - Accept
        - Accept-Version
        - Content-Length
        - Content-MD5
        - Content-Type
        - Date
        - Authorization
      exposed_headers:
        - Authorization
      credentials: true
      max_age: 3600

  - name: prometheus
    config:
      per_consumer: false
      status_code_metrics: true
      latency_metrics: true
      bandwidth_metrics: true
      upstream_health_metrics: true