events { worker_connections 128; }
http {
    access_log off;
    error_log /dev/stderr warn;
    server_tokens off;
    limit_req_zone $binary_remote_addr zone=callbacks:1m rate=20r/s;
    server {
        listen 8080;
        client_max_body_size 16k;
        location = /api/v1/payments/webhook/vnpay {
            limit_except GET POST { deny all; }
            limit_req zone=callbacks burst=100 nodelay;
            proxy_pass http://payment-service:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
        }
        location = /api/v1/payments/return/vnpay {
            limit_except GET { deny all; }
            proxy_pass http://payment-service:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
        }
        location / { return 404; }
    }
}
