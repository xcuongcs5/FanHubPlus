services:
  identity-service:
    image: fanhub-chinhduc-identity-service:local
    build:
      context: ../..
      dockerfile: services/dotnet/FanHub.IdentityService/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: '8080'
      ConnectionStrings__AuthDb: 'Server=sqlserver,1433;Database=fanhub_identity;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;MultipleActiveResultSets=true'
      Jwt__Secret: ${JWT_SECRET:?Run Start-EventService.ps1 or IdentityService first}
      Jwt__Issuer: ${JWT_ISSUER:-FanHub.IdentityService}
      Jwt__Audience: ${JWT_AUDIENCE:-FanHub.Services}
      RabbitMq__Host: rabbitmq
      RabbitMq__Port: '5672'
      RabbitMq__VHost: fanhub
      RabbitMq__Username: fanhub
      RabbitMq__Password: ${RABBITMQ_PASSWORD}
      Redis__ConnectionString: 'redis:6379,password=${REDIS_PASSWORD}'
    ports:
      - '127.0.0.1:${IDENTITY_HTTP_PORT:-5001}:8080'
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
