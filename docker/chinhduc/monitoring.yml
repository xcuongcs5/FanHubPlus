services:
  prometheus:
    image: prom/prometheus:latest
    container_name: fanhub-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      - fanhub-chinhduc_default
  
  grafana:
    image: grafana/grafana:latest
    container_name: fanhub-grafana
    ports:
      - "3030:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    networks:
      - fanhub-chinhduc_default

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.47.0
    container_name: fanhub-cadvisor
    privileged: true
    devices:
      - /dev/kmsg:/dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    ports:
      - "8081:8080"
    networks:
      - fanhub-chinhduc_default

networks:
  fanhub-chinhduc_default:
    external: true