# Optional local service account mount. Production should prefer Workload Identity / ADC.
services:
  notification-service:
    environment:
      Firebase__Enabled: 'true'
      Firebase__ProjectId: ${FIREBASE_PROJECT_ID:?Set the Firebase project ID}
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/firebase-service-account.json
    secrets:
      - source: notification_firebase
        target: firebase-service-account.json
secrets:
  notification_firebase:
    file: ${FIREBASE_CREDENTIALS_FILE:-../secrets/firebase-service-account.json}
